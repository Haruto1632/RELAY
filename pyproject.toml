[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "relay-marl"
version = "0.1.0"
description = "Deterministic heterogeneous multi-agent search-and-rescue environment"
readme = "README.md"
requires-python = ">=3.11.9,<3.12"
dependencies = [
  "numpy>=2.0,<2.4",
  "gymnasium>=1.0,<2",
  "pettingzoo>=1.24,<2",
]

[project.optional-dependencies]
train = [
  "hydra-core>=1.3,<2",
  "pyarrow>=18,<20",
  "tensorboard>=2.18,<3",
  "torch>=2.13,<2.14",
]
viewer = [
  "imageio>=2.36,<3",
  "imageio-ffmpeg>=0.5,<1",
  "PySide6>=6.8,<7",
]
dev = [
  "hypothesis>=6.0,<7",
  "mypy>=1.13,<2",
  "pytest>=8.0,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
relay-train = "relay.train:main"
relay-evaluate = "relay.evaluate:main"
relay-replay = "relay.replay:main"
relay-scenarios = "relay.scenarios:main"
relay-baseline = "relay.baseline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["relay"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["relay.learning.model", "relay.learning.trainer"]
disable_error_code = ["no-untyped-call", "no-any-return"]
